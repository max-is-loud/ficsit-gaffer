name: Foreman bridge receiver

on:
  pull_request:
    paths:
      - 'integrations/foreman-bridge/**'
      - 'packages/ff-server/src/bridge/**'
      - 'packages/ff-server/src/tools/liveStateTools.ts'
      - 'packages/ff-server/src/tools/live/**'
      - 'packages/ff-server/test/bridge-integration.test.ts'
      - '.github/workflows/foreman-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/foreman-bridge/**'
      - 'packages/ff-server/src/bridge/**'
      - 'packages/ff-server/src/tools/liveStateTools.ts'
      - 'packages/ff-server/src/tools/live/**'
      - 'packages/ff-server/test/bridge-integration.test.ts'
      - '.github/workflows/foreman-bridge.yml'

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integrations/foreman-bridge/receiver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Test receiver and HTTPS recovery
        run: npm test
      - name: Check source manifest and fixture parity
        run: node ../scripts/update-source-manifest.mjs --check

  # The receiver needs Node >= 24 (node:sqlite); the main CI job runs Node 22 and
  # skips this end-to-end test, so run it here against the real receiver.
  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Pin npm
        run: |
          npm install -g "npm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - name: Install dependencies
        run: npm ci
      - name: Receiver to backend tool over HTTPS
        run: npm test -w @foreman/ff-server -- test/bridge-integration.test.ts
