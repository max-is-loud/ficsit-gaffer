name: Foreman bridge receiver

on:
  pull_request:
    paths:
      - 'integrations/foreman-bridge/**'
      - '.github/workflows/foreman-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'integrations/foreman-bridge/**'
      - '.github/workflows/foreman-bridge.yml'

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: integrations/foreman-bridge/receiver
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - name: Test receiver and HTTPS recovery
        run: npm test
