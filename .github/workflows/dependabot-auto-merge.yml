name: Dependabot auto-merge

# Auto-merge Dependabot pull requests for low-risk updates. Patch and minor
# updates are merged automatically once CI passes; major updates are left for a
# human to review.
#
# The merge is enabled through GitHub's native auto-merge (`gh pr merge --auto`),
# which queues the pull request and merges it as soon as the required checks
# pass. This replaces the previous approach of commenting `@dependabot squash and
# merge`: GitHub removed that command (along with `@dependabot merge`, `cancel
# merge`, `close` and `reopen`) on 27 January 2026. Dependabot ignores the
# removed commands silently — no reply, no error — so the old workflow looked
# healthy while never merging anything.
#
# Queuing the merge is not enough on its own: the `main protection` ruleset
# requires a code-owner approval, so an unapproved pull request sits at
# reviewDecision: REVIEW_REQUIRED forever with every check green. Being a ruleset
# bypass actor does not help — bypass applies only to an *interactive* merge by
# that actor (`gh pr merge --admin`), while auto-merge waits for every merge
# requirement, review included.
#
# This repository (ficsit-gaffer) has no such ruleset and no AUTOMERGE_TOKEN
# secret yet. Here the approval is not a merge requirement, and the workflow
# only warns. Auto-merge waits only for required checks, so add the ruleset,
# with build-test and validate-game-data as required checks, before you add the
# token.
#
# So the workflow approves as well as queues. CODEOWNERS makes @max-is-loud the
# owner of every path, and GITHUB_TOKEN cannot stand in for them: the repository
# disallows Actions approvals, and github-actions[bot] is not a code owner.
# Both the approval and the merge therefore use AUTOMERGE_TOKEN, a fine-grained
# PAT scoped to this repository with contents: read and write + pull requests:
# read and write. GitHub refuses to add the GitHub Actions app as a bypass actor
# on a user-owned repository ("Actor GitHub Actions integration must be part of
# the ruleset source or owner organization"), which is why a PAT is used at all.
#
# This does mean patch and minor bumps merge without a human reading them — the
# point of auto-merge, but worth being explicit about. Majors still stop for
# review. Required checks are never bypassed: auto-merge waits for build-test and
# validate-game-data, so a red build blocks the merge regardless of the approval.
#
# Uses `pull_request_target` so the workflow definition is always taken from the
# default branch and runs for every Dependabot PR. This is safe here: the job
# only reads PR metadata, approves, comments and enables auto-merge — it never
# checks out or executes pull-request code.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    timeout-minutes: 5
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      # Mirrored into the environment so the steps below can test for its
      # presence: the `secrets` context is not available in a step-level `if`.
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Satisfies the code-owner review. Re-runs on `synchronize` because the
      # ruleset dismisses stale reviews on push and requires the approval to
      # follow the last push, so every Dependabot rebase needs a fresh one.
      - name: Approve patch and minor updates
        if: >-
          env.AUTOMERGE_TOKEN != '' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: |
          gh pr review --approve "$PR_URL" --body "Automated approval: ${{ steps.meta.outputs.update-type }} dependency update."
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: >-
          env.AUTOMERGE_TOKEN != '' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}

      # Without the token the merge would fail on every Dependabot PR and paint
      # CI red. Warn instead, so the gap is visible but the run stays green.
      - name: Warn when the merge token is missing
        if: >-
          env.AUTOMERGE_TOKEN == '' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor')
        run: |
          echo "::warning::AUTOMERGE_TOKEN is not set — auto-merge is disabled and this pull request needs a manual merge."

      # Only on the first open: `synchronize` fires on every Dependabot rebase,
      # and commenting there repeats the same note on a long-lived PR.
      - name: Flag major updates for manual review
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major' &&
          github.event.action != 'synchronize'
        run: gh pr comment "$PR_URL" --body "🔍 Major version update — left for manual review (auto-merge covers patch/minor only)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
