# Drop-in for satisfactory.service: /etc/systemd/system/satisfactory.service.d/bridge.conf
# It adds to the unit; it does not edit it. The unit's ExecStartPre (steamcmd update) stays
# first, because systemd keeps the lines of the unit before the lines of a drop-in. Our guard
# runs after it, so it sees the game build that is about to start.
[Unit]
# Start the receiver first, so the plugin finds it at startup. Wants is a soft link: a stopped
# or failed receiver never stops the game, and stopping the game never stops the receiver.
Wants=gaffer-bridge-receiver.service
After=gaffer-bridge-receiver.service

[Service]
# Keeps the mods off on a game build that is not in /etc/gaffer-bridge-game/supported-builds.
# There is deliberately no "-" prefix. The guard exits non-zero in ONE case only: mods are
# present, the build is not approved, and the mods cannot be moved away. Then the game must not
# start, because SML on an unapproved build can crash the game or write mod data into the save.
# In every other case the guard exits 0, and with no Mods folder it exits 0 whatever else fails.
ExecStartPre=/opt/gaffer-bridge/bin/mods-control.sh guard
# A drop-in cannot append to ExecStart. This is the unit's line plus the plugin's config flag.
# Without the plugin (mods off), the game ignores the flag.
ExecStart=
ExecStart=/home/satisfactory/server/FactoryServer.sh -Port=7777 -ReliablePort=8888 -ForemanBridgeConfig=/etc/gaffer-bridge-game/bridge.json
